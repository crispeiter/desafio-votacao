spring:
  application:
    name: votacao

  datasource:
    url: jdbc:postgresql://localhost:5432/votacao
    username: votacao
    password: votacao
    hikari:
      pool-name: votacao-pool
      maximum-pool-size: 20

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Grava e le timestamptz sempre em UTC, para que Instant nao dependa do fuso da JVM
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

votacao:
  sessao:
    duracao-padrao: 60s

  cpf:
    modo: ALEATORIO
    # O servico fake de autorizacao roda dentro desta mesma aplicacao, entao o default
    # aponta para ela. Trocar pelo provedor real e mudanca de configuracao, nao de codigo.
    base-url: http://localhost:8080
    timeout-conexao: 2s
    timeout-leitura: 3s

  # Sem o prefixo /api/v1: o assembler de telas concatena o path completo de cada endpoint.
  # Sobrescrever por VOTACAO_CALLBACK_BASE_URL quando o app rodar em dispositivo fisico.
  callback-base-url: http://localhost:8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.db.votacao: INFO
